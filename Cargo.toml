[package]
name = "chzzkd"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0.103"
rand = "0.10.2"
log = "0.4.33"
env_logger = "0.11.11"
